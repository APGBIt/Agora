@keyframes blink { 50% { opacity: .3; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .v { font-size: 24px; font-weight: 700; line-height: 1.1; }
.tile .v small { font-size: 13px; color: var(--muted); font-weight: 600; }
.status { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.status.good { color: var(--teal); }
.status.warn { color: var(--amber-ink); }
.status.info { color: var(--muted); }
.transcript { font-size: 15px; line-height: 1.8; color: var(--ink-2); }
.transcript mark { background: var(--coral-soft); color: var(--ink); padding: 1px 4px; border-radius: 4px; }
.transcript .weak { text-decoration: underline wavy var(--violet); text-underline-offset: 3px; }
.transcript .rep { text-decoration: line-through; text-decoration-color: var(--amber); color: var(--muted); }
.transcript .pz { color: var(--teal); font-weight: 700; margin: 0 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.check { width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--teal-soft); color: var(--teal); }
.go-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 8px 14px; background: var(--amber-soft); border-radius: 12px; color: var(--amber-deep); font-size: 14px; font-weight: 700; text-decoration: none; border: 0; width: 100%; text-align: left; }
.search { position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 15px; outline: none; color: var(--ink); }
.cat { display: flex; flex-direction: column; gap: 10px; padding: 16px 14px; min-height: 168px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: var(--ink); text-align: left; }
.cat .t { font-size: 15px; font-weight: 700; line-height: 1.25; }
.cat .d { font-size: 13px; line-height: 1.4; color: var(--muted); flex: 1; }
.cat .n { font-size: 12px; font-weight: 700; }
.banner { display: flex; align-items: center; gap: 14px; padding: 18px; background: var(--teal); color: var(--on-teal); border-radius: 18px; text-decoration: none; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: var(--ink); text-align: left; width: 100%; }
.item .t { font-size: 15px; font-weight: 700; }
.item .d { font-size: 13px; color: var(--muted); }
.word { min-height: 44px; padding: 4px 8px; border-radius: 10px; border: 2px solid transparent; font-family: var(--font-display); font-size: 22px; font-weight: 600; background: var(--sunken); color: var(--ink); }
.word.ok { background: var(--teal-soft); color: var(--teal-ink); }
.word.casi { background: var(--amber-soft); color: var(--amber-deep); text-decoration: underline dotted 2px var(--amber); text-underline-offset: 5px; }
.word.repite { background: var(--coral-soft); color: var(--coral-ink); text-decoration: underline solid 2px var(--coral); text-underline-offset: 5px; }
.word[aria-pressed="true"] { border-color: var(--ink); }
.focus-txt { font-family: var(--font-display); font-size: 25px; line-height: 1.4; font-weight: 600; margin: 0; }
.focus-txt b { color: var(--teal); background: var(--teal-soft); border-radius: 4px; padding: 0 2px; font-weight: 600; }
.mic-big { width: 76px; height: 76px; border-radius: 38px; border: 0; background: var(--teal); color: var(--on-teal); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-fab); touch-action: none; }
.mic-big.on { background: #E0583E; color: #FFFDF8; animation: pulse 1.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(224, 88, 62, .45); } 100% { box-shadow: 0 0 0 18px rgba(224, 88, 62, 0); } }
.breath { --b-bg: #0F3D3A; --b-ink: #EAF4F1; --b-muted: #B5D6D0; --b-panel: #1A4A46; background: var(--b-bg); color: var(--b-ink); display: flex; flex-direction: column; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.breath .icon-btn { color: var(--b-ink); }
.breath .orb-wrap { position: relative; width: min(300px, 78vw); aspect-ratio: 1; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
.breath .ring1, .breath .ring2 { position: absolute; border-radius: 50%; border: 1px solid rgba(156, 211, 202, .3); }
.breath .ring1 { inset: 0; }
.breath .ring2 { inset: 8%; border-color: rgba(156, 211, 202, .4); }
.breath .orb { width: 73%; aspect-ratio: 1; border-radius: 50%; background: #1F5C57; box-shadow: 0 0 0 14px rgba(95, 179, 168, .18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition-property: transform; transition-timing-function: ease-in-out; }
.breath .phase { padding: 10px 8px; border-radius: 12px; background: var(--b-panel); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.breath .phase.on { background: var(--b-ink); color: var(--b-bg); }
.breath .panel { display: flex; gap: 10px; padding: 12px 14px; background: var(--b-panel); border-radius: 12px; font-size: 13px; line-height: 1.5; color: #D6EAE6; }
.breath .round { width: 52px; height: 52px; border-radius: 26px; border: 0; background: var(--b-panel); color: var(--b-ink); display: flex; align-items: center; justify-content: center; }
.breath .main { width: 72px; height: 72px; border-radius: 36px; border: 0; background: var(--b-ink); color: var(--b-bg); display: flex; align-items: center; justify-content: center; }
.bubble { max-width: 86%; padding: 12px 14px; font-size: 15px; line-height: 1.45; }
.bubble.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; }
.bubble.me { align-self: flex-end; background: var(--teal); color: var(--on-teal); border-radius: 16px 16px 4px 16px; }
.bubble.me mark { background: var(--amber-soft); color: var(--amber-deep); padding: 0 4px; border-radius: 4px; }
.bubble.tip { align-self: stretch; max-width: none; background: var(--violet-soft); color: var(--violet-ink); border-radius: 12px; font-size: 13px; }
.typing { align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; border: 1px dashed var(--line-2); font-size: 13px; color: var(--muted); }
.typing i { width: 6px; height: 6px; border-radius: 3px; background: var(--violet-mid); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
.part { padding: 8px 4px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; text-align: center; }
.part.hit { background: var(--teal-soft); color: var(--teal-ink); }
.part.now { background: var(--amber-soft); color: var(--amber-deep); border: 2px solid var(--amber); }
.part.miss { border: 1px dashed var(--line-2); color: var(--muted); }
.avatar { width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: var(--violet-soft); color: var(--violet); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: flex; gap: 12px; }
.timeline .rail { display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0; }
.timeline .dot { width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.timeline .dot.done { background: var(--teal); color: var(--on-teal); }
.timeline .dot.now { background: var(--amber-soft); border: 2px solid var(--amber); color: var(--amber-deep); }
.timeline .dot.todo { border: 2px solid var(--line-2); color: var(--muted); }
.timeline .line { width: 2px; flex: 1; background: var(--line-2); }
.timeline .line.done { background: var(--teal); }
.timeline .body { flex: 1; min-width: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
textarea.field, input.field, select.field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 15px; line-height: 1.45; color: var(--ink); resize: vertical; }
select.field { min-height: 44px; appearance: auto; }
textarea.field:focus, input.field:focus, select.field:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
textarea.field.now { border: 2px solid var(--amber); }
textarea.field.todo { border-style: dashed; border-color: var(--line-2); background: transparent; }
.title-input { border: 0; background: transparent; padding: 0; font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--ink); width: 100%; outline: none; }
.suggest { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; background: var(--violet-soft); border-radius: 12px; font-size: 13px; line-height: 1.45; color: var(--violet-ink); }
.chart { display: flex; gap: 8px; }
.chart .yax { display: flex; flex-direction: column; justify-content: space-between; height: 128px; margin-top: -6px; font-size: 11px; color: var(--muted-2); text-align: right; width: 22px; }
.chart .plot { position: relative; height: 120px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--bgap, 10px); align-items: end; border-bottom: 1px solid var(--line-2); }
.chart .grid-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.chart .b { position: relative; background: var(--teal); border-radius: 4px 4px 0 0; min-height: 0; border: 0; padding: 0; }
.chart .b.today { background: var(--teal-soft); outline: 2px dashed var(--teal); outline-offset: -2px; }
.chart .b .lbl { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.chart .xax { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--bgap, 10px); font-size: 12px; color: var(--muted); text-align: center; }
.tooltip { position: absolute; bottom: calc(100% + 26px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; z-index: 2; pointer-events: none; }
.skill-row { display: grid; grid-template-columns: 122px minmax(0, 1fr) 30px 44px; gap: 10px; align-items: center; font-size: 14px; }
.badge { padding: 14px 8px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--surface); border: 1px solid var(--line); }
.badge.locked { background: transparent; border-style: dashed; border-color: var(--line-2); }
.badge .ic { width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; }
.badge .t { font-size: 12px; font-weight: 700; line-height: 1.3; }
.milestones { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
.milestones .track { position: absolute; left: 20px; right: 20px; top: 50%; height: 4px; margin-top: -2px; background: var(--sunken); border-radius: 2px; }
.milestones .track > span { display: block; height: 100%; background: var(--amber); border-radius: 2px; }
.milestones .m { position: relative; width: 38px; height: 38px; border-radius: 19px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 2px solid var(--line-2); color: var(--muted); }
.milestones .m.done { background: var(--amber); border-color: var(--amber); color: var(--surface); }
.milestones .m.next { border-color: var(--amber); color: var(--amber-deep); }
.backdrop { position: fixed; inset: 0; background: rgba(20, 19, 17, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; padding: 20px var(--gutter) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); align-self: center; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 60; width: calc(100% - 32px); max-width: 440px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 14px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); animation: toast-in .25s ease; pointer-events: auto; }
@keyframes toast-in { from { transform: translateY(-8px); opacity: 0; } }
.celebrate { position: fixed; inset: 0; z-index: 70; background: rgba(14, 92, 87, .92); color: #FFFDF8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.celebrate .big { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; }
.celebrate .btn-light { background: #FFFDF8; color: #0E5C57; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--amber-soft); color: var(--ink); font-size: 14px; line-height: 1.45; }
.notice.teal { background: var(--teal-soft); color: var(--teal-ink); }
.notice.violet { background: var(--violet-soft); color: var(--violet-ink); }
.upload { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: var(--r-surface, var(--surface)); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media (min-width: 520px) {
body { background: var(--sunken); }
.app { box-shadow: 0 0 0 1px var(--line); }
}
.faq { display: flex; flex-direction: column; }
.faq details { border-top: 1px solid var(--line); }
.faq details:first-child { border-top: 0; }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; padding: 10px 0; font-weight: 700; font-size: 15px; line-height: 1.35; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; font-size: 22px; line-height: 1; color: var(--teal); font-weight: 500; flex-shrink: 0; }
.faq details[open] summary::after { content: '−'; }
.faq .a { padding: 0 0 14px; font-size: 14px; line-height: 1.55; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.faq .a p, .policy p { margin: 0; }
.faq .a ul, .policy ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.policy .card p, .policy .card li { font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.policy .card { gap: 20px; }
.feature { display: flex; flex-direction: column; gap: 8px; padding: 16px 14px; min-height: 156px; border-radius: 18px; text-decoration: none; background: var(--teal); color: var(--on-teal); }
.feature.violet { background: var(--violet); }
.feature .t { font-size: 16px; font-weight: 700; line-height: 1.25; }
.feature .d { font-size: 13px; line-height: 1.4; opacity: .9; }
.item .d { overflow-wrap: anywhere; }
.scale { position: relative; display: flex; gap: 3px; height: 8px; }
.scale > span { background: var(--sunken); border-radius: 4px; }
.scale > span.on { background: var(--teal-mid); }
.scale > i { position: absolute; top: -4px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
.scale-labels { display: flex; gap: 3px; }
.scale-labels > span { font-size: 11px; line-height: 1.2; color: var(--muted); text-align: center; }
.scale-labels > span.on { color: var(--ink); font-weight: 700; }
.lvl { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.lvl.good { background: var(--teal-soft); color: var(--teal-ink); }
.lvl.warn { background: var(--amber-soft); color: var(--amber-ink); }
.lvl.low { background: var(--coral-soft); color: var(--coral-ink); }

 necesita un obst\xE1culo. Sin conflicto, no hay atenci\xF3n.","Evita disculparte por hablar: \xABperd\xF3n que les quite tiempo\xBB resta fuerza.","Afirma lo que sabes. \xABCreo que\xBB sobra cuando tienes certeza.","Termina tu frase final y haz silencio. No a\xF1adas \xABy bueno, eso es todo\xBB.","Bebe agua a temperatura ambiente antes de hablar; el agua fr\xEDa tensa la garganta.","Ap\xF3yate en el abdomen, no en la garganta, para subir el volumen.","Ensaya el inicio y el cierre palabra por palabra; el medio, con ideas clave.","Una pausa antes de un dato importante lo convierte en protagonista.","Preg\xFAntate: \xBFqu\xE9 quiero que recuerden al salir? Construye todo alrededor de eso.","Habla a la \xFAltima fila: tu voz se ajusta sola cuando imaginas la distancia.","Las palabras concretas pintan im\xE1genes: \xABun expediente de 400 p\xE1ginas\xBB vale m\xE1s que \xABmucho trabajo\xBB.","Si hablas con prisa, la audiencia siente prisa. Si respiras, respira contigo.","Un buen ejemplo vale m\xE1s que tres adjetivos.","Var\xEDa el tono: sube en la pregunta, baja en la conclusi\xF3n.","Antes de una reuni\xF3n, di tu idea principal en una sola frase en voz alta.","Llega dos minutos antes: saludar a la gente convierte extra\xF1os en aliados.","Graba en tu mente tres palabras clave, no un texto: as\xED no te bloqueas.","Respeta el tiempo: terminar un minuto antes siempre se agradece.","Nombra a tu audiencia: \xABustedes que atienden usuarios cada d\xEDa\u2026\xBB conecta m\xE1s que \xABla gente\xBB.","Cuando uses una sigla, dila completa la primera vez.","Tu postura cambia tu voz: pies firmes y hombros sueltos antes de empezar.","Si sientes nervios, ll\xE1malos energ\xEDa. El cuerpo responde a c\xF3mo lo nombras.","Despu\xE9s de preguntar \xAB\xBFalguna duda?\xBB, cuenta en silencio hasta cinco.","Resume al final en una frase. Lo \xFAltimo que oyen es lo primero que recuerdan.","Celebra tu progreso: cada pr\xE1ctica de hoy es un minuto menos de nervios ma\xF1ana."];var tras la otra persona todav\xEDa est\xE1 hablando. Es mirar, asentir y hacer una pregunta que demuestre que entendiste. Cuando alguien se siente escuchado, baja la guardia y se abre a nuevas ideas. En una reuni\xF3n, la persona que mejor escucha suele ser la que mejor resume, y quien resume bien termina guiando la conversaci\xF3n. Prueba esto hoy: antes de responder, repite con tus palabras lo que te dijeron. \xABSi te entiendo bien, lo que te preocupa es el plazo\xBB. Esa frase sencilla evita malentendidos, ahorra tiempo y construye confianza. Escuchar no es un gesto pasivo: es la forma m\xE1s respetuosa de liderar una conversaci\xF3n.",words:[{w:"parafrasear",def:"Repetir con tus propias palabras lo que dijo otra persona."},{w:"asentir",def:"Mostrar acuerdo o atenci\xF3n con un gesto de la cabeza."},{w:"malentendido",def:"Interpretaci\xF3n equivocada de lo que se dijo."}],talk:["\xBFQui\xE9n es la persona que mejor te escucha y qu\xE9 hace diferente?","\xBFEs m\xE1s dif\xEDcil escuchar en el trabajo o en la familia? Explica por qu\xE9.","Cuenta una vez en que un malentendido se resolvi\xF3 con una buena pregunta."],book:{title:"Inteligencia emocional",author:"Daniel Goleman",why:"Explica c\xF3mo la empat\xEDa y el autocontrol mejoran nuestras conversaciones."}},{id:"liderar",cat:"Liderazgo",title:"Liderar con el ejemplo",text:"Un equipo aprende m\xE1s de lo que ve que de lo que escucha. Si quien dirige llega tarde, nadie cree en la puntualidad; si reconoce sus errores, el equipo se atreve a reconocer los suyos. Liderar con el ejemplo no exige discursos largos, sino coherencia diaria entre lo que dices y lo que haces. Los buenos l\xEDderes explican el porqu\xE9 de las decisiones, piden opini\xF3n antes de decidir y dan cr\xE9dito en p\xFAblico. Cuando algo sale mal, preguntan qu\xE9 podemos aprender antes de preguntar qui\xE9n tuvo la culpa. Esa actitud crea un ambiente donde las personas proponen, prueban y mejoran. Al final, la autoridad m\xE1s duradera no viene del cargo, sino de la confianza que construyes cada d\xEDa con peque\xF1os actos.",words:[{w:"coherencia",def:"Relaci\xF3n l\xF3gica entre lo que se dice y lo que se hace."},{w:"reconocer",def:"Admitir algo como cierto; tambi\xE9n, valorar el m\xE9rito de alguien."},{w:"duradero",def:"Que se mantiene en el tiempo."}],talk:["\xBFQu\xE9 l\xEDder te marc\xF3 y por qu\xE9?","\xBFSe nace l\xEDder o se aprende a serlo? Toma una postura.","\xBFC\xF3mo dar\xEDas una mala noticia a tu equipo sin perder su confianza?"],book:{title:"Los 7 h\xE1bitos de la gente altamente efectiva",author:"Stephen R. Covey",why:"Un cl\xE1sico sobre coherencia personal y liderazgo."}},{id:"domingo",cat:"Cultura dominicana",title:"La mesa del domingo",text:"En muchos hogares dominicanos, el domingo tiene olor a saz\xF3n. Desde temprano se escucha el cuchillo en la tabla, el caldero en el fog\xF3n y alguien que pregunta si ya llegaron los primos. La comida del domingo es m\xE1s que un almuerzo: es el lugar donde se cuentan las noticias de la semana, se discuten los juegos de pelota y se ponen al d\xEDa los cuentos de la familia. La abuela sirve primero a los dem\xE1s y come de \xFAltima. Los ni\xF1os esperan el conc\xF3n como un premio. Alrededor de esa mesa aprendimos a esperar el turno para hablar, a contar historias con gracia y a defender una opini\xF3n con cari\xF1o. Quiz\xE1s nuestra primera escuela de oratoria fue, sin saberlo, la mesa del domingo.",words:[{w:"conc\xF3n",def:"La capa de arroz tostado que queda en el fondo del caldero."},{w:"fog\xF3n",def:"Lugar de la cocina donde se hace el fuego para cocinar."},{w:"saz\xF3n",def:"Punto de sabor de una comida; tambi\xE9n, el toque de quien cocina."}],talk:["\xBFQu\xE9 plato no puede faltar en tu mesa del domingo y por qu\xE9?","Cuenta una historia que siempre se repite en tu familia.","\xBFQu\xE9 costumbre dominicana le ense\xF1ar\xEDas a alguien de otro pa\xEDs?"],book:{title:"Cuentos escritos en el exilio",author:"Juan Bosch",why:"Relatos dominicanos cortos, perfectos para leer en voz alta y aprender a narrar."}},{id:"ia",cat:"Tecnolog\xEDa",title:"La inteligencia artificial en el d\xEDa a d\xEDa",text:"La inteligencia artificial ya no es cosa de pel\xEDculas. Est\xE1 en el teclado que te sugiere la siguiente palabra, en el mapa que calcula la ruta con menos tr\xE1fico y en las aplicaciones que transcriben lo que dices. Estas herramientas aprenden patrones a partir de enormes cantidades de datos y responden con rapidez, pero no piensan como una persona ni conocen tu contexto. Por eso la pregunta importante no es si debemos usarlas, sino c\xF3mo usarlas bien. Revisar lo que producen, proteger nuestros datos y decidir con criterio propio son habilidades que cada vez valen m\xE1s. La tecnolog\xEDa puede ahorrarnos tiempo; lo que hagamos con ese tiempo sigue siendo una decisi\xF3n humana.",words:[{w:"patr\xF3n",def:"Modelo que se repite y permite predecir algo."},{w:"criterio",def:"Norma o juicio para decidir o valorar algo."},{w:"transcribir",def:"Pasar a texto escrito lo que se dice en voz alta."}],talk:["\xBFPara qu\xE9 usar\xEDas la inteligencia artificial en tu trabajo y para qu\xE9 no?","\xBFQui\xE9n deber\xEDa responder por el error de una m\xE1quina? Defiende tu postura.","Explica a una persona mayor qu\xE9 es la inteligencia artificial en un minuto."],book:{title:"Sapiens. De animales a dioses",author:"Yuval Noah Harari",why:"Da contexto sobre c\xF3mo las grandes innovaciones han transformado a la humanidad."}},{id:"descanso",cat:"Bienestar",title:"Descansar tambi\xE9n es producir",text:"Vivimos con la sensaci\xF3n de que siempre deber\xEDamos estar haciendo algo. Sin embargo, el cerebro necesita pausas para ordenar lo aprendido y recuperar energ\xEDa. Dormir bien mejora la memoria, el humor y la capacidad de concentrarnos. Una caminata corta al mediod\xEDa puede aclarar un problema que llevamos horas mirando en la pantalla. Incluso para hablar en p\xFAblico el descanso cuenta: una voz cansada pierde fuerza y una mente agotada busca muletillas. Descansar no es un premio para despu\xE9s del trabajo terminado; es parte del trabajo bien hecho. Pon tu descanso en la agenda con la misma seriedad que una reuni\xF3n. Tu cuerpo, tu voz y tu equipo lo van a notar.",words:[{w:"agotado",def:"Muy cansado, sin energ\xEDa."},{w:"concentraci\xF3n",def:"Capacidad de mantener la atenci\xF3n en una sola cosa."},{w:"recuperar",def:"Volver a tener algo que se hab\xEDa perdido."}],talk:["\xBFC\xF3mo descansas de verdad? Describe tu mejor manera de recargar energ\xEDa.","\xBFDeber\xEDa evitarse enviar mensajes de trabajo de noche? Toma partido.","Convence a alguien de dormir una hora m\xE1s cada noche."],book:{title:"Por qu\xE9 dormimos",author:"Matthew Walker",why:"Explica con ciencia y buenos ejemplos por qu\xE9 el sue\xF1o cambia c\xF3mo pensamos y sentimos."}},{id:"agua",cat:"Medio ambiente",title:"Cada gota cuenta",text:"Abrimos la llave y el agua sale, tan f\xE1cil que olvidamos el largo camino que recorre. Viene de r\xEDos y presas, pasa por plantas de tratamiento y viaja por tuber\xEDas hasta nuestra casa. En un pa\xEDs con sequ\xEDas y temporadas de lluvias intensas, cuidar el agua es cuidar la salud, la agricultura y la energ\xEDa. Hay gestos sencillos que suman: cerrar la llave mientras nos cepillamos, reparar una fuga a tiempo, reutilizar el agua de lavar para limpiar el patio. Tambi\xE9n cuenta lo que pedimos como comunidad: proteger las cuencas, reforestar las orillas de los r\xEDos y no tirar basura en las ca\xF1adas. El agua no se fabrica; solo se cuida o se desperdicia.",words:[{w:"cuenca",def:"Territorio cuyas aguas desembocan en un mismo r\xEDo o lago."},{w:"reforestar",def:"Volver a plantar \xE1rboles donde se perdieron."},{w:"desperdiciar",def:"Gastar algo sin provecho."}],talk:["\xBFQu\xE9 har\xEDas si fueras responsable del agua de tu ciudad durante un a\xF1o?","Convence a tu familia de ahorrar agua con tres acciones concretas.","\xBFQui\xE9n tiene m\xE1s responsabilidad: las personas o las empresas? Defiende tu postura."],book:{title:"Primavera silenciosa",author:"Rachel Carson",why:"El libro que despert\xF3 la conciencia ambiental moderna."}},{id:"voz",cat:"Ciencia y curiosidades",title:"Lo que tu voz dice de ti",text:"Antes de entender tus palabras, quien te escucha ya est\xE1 leyendo tu voz. El tono, el volumen y la velocidad revelan si hay nervios, entusiasmo o cansancio. La voz nace cuando el aire de los pulmones hace vibrar las cuerdas vocales, dos peque\xF1os pliegues en la garganta que se abren y se cierran cientos de veces por segundo. Luego la boca, la nariz y la garganta funcionan como una caja de resonancia que da a cada voz su color \xFAnico. Por eso la voz se puede entrenar como un m\xFAsculo: respirar desde el abdomen le da apoyo, relajar la mand\xEDbula le da claridad y variar el tono le da vida. Tu voz no es fija; es un instrumento que aprendes a tocar.",words:[{w:"resonancia",def:"Prolongaci\xF3n y amplificaci\xF3n de un sonido dentro de un espacio."},{w:"cuerdas vocales",def:"Pliegues de la laringe que vibran para producir la voz."},{w:"timbre",def:"El color propio de una voz o de un instrumento."}],talk:["\xBFQu\xE9 voz te inspira confianza (de la radio, el cine o tu entorno) y por qu\xE9?","Explica c\xF3mo se produce la voz como si hablaras con alguien de diez a\xF1os.","\xBFSe puede conocer a alguien solo por su voz? Da tu opini\xF3n con un ejemplo."],book:{title:"Charlas TED: la gu\xEDa oficial TED para hablar en p\xFAblico",author:"Chris Anderson",why:"Consejos pr\xE1cticos de quien dirige las charlas TED."}},{id:"mariposas",cat:"Historia y valores",title:"Las Mariposas",text:"El 25 de noviembre de 1960, las hermanas Patria, Minerva y Mar\xEDa Teresa Mirabal fueron asesinadas por orden de la dictadura de Trujillo. Las recordamos como las Mariposas, el nombre con que se les conoc\xEDa en la lucha clandestina. Su valent\xEDa se convirti\xF3 en un s\xEDmbolo de dignidad para el pueblo dominicano, y su muerte aviv\xF3 el rechazo contra el r\xE9gimen. A\xF1os despu\xE9s, la Asamblea General de las Naciones Unidas declar\xF3 el 25 de noviembre como el D\xEDa Internacional de la Eliminaci\xF3n de la Violencia contra la Mujer. Hoy su historia nos recuerda que alzar la voz tiene un precio, pero que el silencio ante la injusticia cuesta todav\xEDa m\xE1s. Contarla es una forma de mantener viva su palabra.",words:[{w:"clandestino",def:"Secreto, hecho a escondidas de la autoridad."},{w:"r\xE9gimen",def:"Sistema de gobierno; aqu\xED, la dictadura."},{w:"dignidad",def:"Valor que tiene toda persona y que merece respeto."}],talk:["\xBFQu\xE9 significa para ti alzar la voz ante una injusticia?","Cuenta la historia de una mujer dominicana que admires.","\xBFC\xF3mo le explicar\xEDas a un adolescente por qu\xE9 recordamos el 25 de noviembre?"],book:{title:"En el tiempo de las mariposas",author:"Julia \xC1lvarez",why:"Novela sobre las hermanas Mirabal, contada con cuatro voces distintas."}},{id:"aprender",cat:"Educaci\xF3n",title:"Nunca es tarde para aprender",text:"Durante mucho tiempo se crey\xF3 que el cerebro adulto ya no cambiaba. Hoy sabemos que aprende toda la vida: cada vez que practicamos algo nuevo, se refuerzan conexiones entre neuronas. Por eso aprender un idioma, un instrumento o a hablar mejor en p\xFAblico es posible a cualquier edad. El secreto no est\xE1 en el talento, sino en la pr\xE1ctica frecuente y en equivocarse sin miedo. Diez minutos diarios valen m\xE1s que dos horas un solo d\xEDa, porque la pr\xE1ctica espaciada ayuda a fijar lo aprendido. Cuando algo nos cuesta, no es se\xF1al de que no servimos para eso; es se\xF1al de que el cerebro est\xE1 trabajando. La curiosidad no tiene fecha de vencimiento.",words:[{w:"neurona",def:"C\xE9lula del sistema nervioso que transmite informaci\xF3n."},{w:"espaciado",def:"Con intervalos de tiempo entre una vez y otra."},{w:"vencimiento",def:"Momento en que algo termina o deja de valer."}],talk:["\xBFQu\xE9 te gustar\xEDa aprender este a\xF1o y qu\xE9 te detiene?","Cuenta algo que aprendiste en la adultez y c\xF3mo lo lograste.","\xBFDeber\xEDa la escuela ense\xF1ar a hablar en p\xFAblico? Defiende tu respuesta."],book:{title:"Mindset: la actitud del \xE9xito",author:"Carol S. Dweck",why:"Explica la mentalidad de crecimiento: las habilidades se desarrollan con esfuerzo."}},{id:"lenguaje-claro",cat:"Servicio p\xFAblico",title:"La justicia que se entiende",text:"Una sentencia, un formulario o una carta institucional solo cumplen su prop\xF3sito si la persona que los recibe puede entenderlos. El lenguaje claro busca exactamente eso: frases cortas, palabras conocidas, el mensaje principal al inicio y los pasos siguientes bien explicados. No se trata de simplificar la ley ni de perder precisi\xF3n, sino de pensar en quien lee. Cuando la ciudadan\xEDa entiende lo que se decidi\xF3 y por qu\xE9, conf\xEDa m\xE1s en sus instituciones y sabe c\xF3mo ejercer sus derechos. Hablar claro tambi\xE9n es una forma de servicio: ahorra dudas, reduce errores y acerca la justicia a la gente. La pr\xF3xima vez que expliques algo t\xE9cnico, preg\xFAntate: \xBFlo entender\xEDa mi vecina?",words:[{w:"precisi\xF3n",def:"Exactitud en el uso de las palabras y los datos."},{w:"ciudadan\xEDa",def:"Conjunto de personas de un pa\xEDs, con sus derechos y deberes."},{w:"prop\xF3sito",def:"Objetivo o intenci\xF3n de algo."}],talk:["Explica un tr\xE1mite complicado en menos de un minuto y sin tecnicismos.","\xBFPor qu\xE9 crees que muchas instituciones escriben de forma dif\xEDcil?","Convence a tu equipo de usar lenguaje claro en sus documentos."],book:{title:"C\xF3mo hablar bien en p\xFAblico e influir en los hombres de negocios",author:"Dale Carnegie",why:"Un cl\xE1sico con t\xE9cnicas sencillas para comunicar con claridad y confianza."}},{id:"historias",cat:"Storytelling",title:"Por qu\xE9 recordamos las historias",text:"Si te pido que recuerdes una lista de datos de la semana pasada, probablemente te . Empieza cuando decides qu\xE9 quieres que tu audiencia recuerde. Con esa idea clara, cada ejemplo, cada dato y cada pausa trabajan a tu favor. Habla a un ritmo que permita pensar, a ti y a quien te escucha.",pacer:140},{id:"proy-sostenida",cat:"proyeccion",type:"read",title:"Proyecci\xF3n sostenida",minutes:3,level:2,xp:30,desc:"Mant\xE9n el volumen hasta la \xFAltima palabra de cada frase.",text:"Gracias a todos por estar aqu\xED esta ma\xF1ana. Hoy vamos a decidir algo importante para el equipo. Quiero que cada persona salga con una tarea clara. Empezamos puntualmente a las nueve. Cuento con ustedes hasta el final.",focusMetric:"volume"},{id:"proy-vocal-a",cat:"proyeccion",type:"sustain",mode:"aaa",title:"Vocal sostenida",minutes:2,level:1,xp:25,desc:"Sost\xE9n una \xABaaa\xBB pareja: ni m\xE1s fuerte ni m\xE1s d\xE9bil.",goalSec:15,steps:["Inhala profundo.","Di \xABaaa\xBB con voz c\xF3moda, como si llamaras a alguien a lo lejos.","Mant\xE9n el mismo volumen hasta el final."],tip:"Apoya desde el abdomen, no desde la garganta."},{id:"proy-sirena",cat:"proyeccion",type:"glide",title:"La sirena",minutes:2,level:1,xp:25,desc:"Desliza la voz de grave a agudo y de vuelta para ganar expresividad.",goalSt:12,steps:["Con la boca cerrada, haz \xABmmm\xBB en tu tono m\xE1s grave.","Sube despacio hasta el m\xE1s agudo que puedas sin forzar.","Baja de nuevo, como una sirena."],tip:"Una voz con m\xE1s rango suena m\xE1s viva y menos mon\xF3tona."},{id:"canto-calentamiento",cat:"canto",type:"guided",title:"Calentamiento de cantante",minutes:3,level:1,xp:20,desc:"Prepara la voz como lo hacen los cantantes antes de un concierto.",steps:[{name:"Bostezo y suspiro",sec:20,hint:"Bosteza con la boca abierta y suelta el aire con un suspiro que baja de agudo a grave."},{name:"Vibraci\xF3n de labios",sec:30,hint:"Haz \xABbrrr\xBB con los labios sueltos, como un motor, subiendo y bajando el tono."},{name:"Tarareo",sec:30,hint:"Con la boca cerrada di \xABmmm\xBB en una nota c\xF3moda. Siente cosquillas en labios y nariz."},{name:"Vocales en una nota",sec:30,hint:"En la misma nota canta \xABmi, me, ma, mo, mu\xBB sin mover la mand\xEDbula de m\xE1s."},{name:"Sirena suave",sec:25,hint:"Con \xABnnn\xBB o \xABng\xBB sube despacio al agudo y baja al grave, sin forzar."},{name:"Frase hablada",sec:15,hint:"Di con voz relajada: \xABBuenos d\xEDas, qu\xE9 gusto verlos\xBB. Nota c\xF3mo suena m\xE1s libre."}]},{id:"canto-escala",cat:"canto",type:"pitch",title:"Escala do-re-mi",minutes:2,level:1,xp:30,desc:"Escucha cada nota y rep\xEDtela. La app te dice si est\xE1s en el tono.",intervals:[0,2,4,5,7,5,4,2,0],hold:2.2,tip:"Si te quedas abajo, sonr\xEDe un poco y piensa la nota \xABarriba\xBB antes de cantarla."},{id:"canto-arpegio",cat:"canto",type:"pitch",title:"Arpegio do-mi-sol",minutes:2,level:2,xp:30,desc:"Saltos de nota m\xE1s grandes: entrena el o\xEDdo y la flexibilidad de la voz.",intervals:[0,4,7,4,0,7,0],hold:2.2,tip:"En los saltos grandes, respira antes y apunta a la nota sin deslizarte."},{id:"canto-nota-firme",cat:"canto",type:"pitch",title:"Nota firme",minutes:2,level:2,xp:30,desc:"Sost\xE9n cada nota cinco segundos sin que se caiga ni tiemble.",intervals:[0,2,4],hold:5,tip:"Apoya el aire desde el abdomen. Al final de la nota es cuando m\xE1s se baja: sostenla."},{id:"canto-entonacion",cat:"canto",type:"intonation",title:"\xBFPregunta o afirmaci\xF3n?",minutes:3,level:1,xp:30,desc:"Di la misma frase como pregunta y como afirmaci\xF3n. La app escucha si tu tono sube o baja al final.",items:[["Vienes ma\xF1ana.","\xBFVienes ma\xF1ana?"],["Ya terminaste el informe.","\xBFYa terminaste el informe?"],["Lleg\xF3 el nuevo equipo.","\xBFLleg\xF3 el nuevo equipo?"],["La reuni\xF3n es a las nueve.","\xBFLa reuni\xF3n es a las nueve?"]],tip:"En espa\xF1ol, la pregunta de s\xED o no sube al final; la afirmaci\xF3n baja. Exagera al principio."},{id:"canto-enfasis",cat:"canto",type:"read",title:"Mueve el \xE9nfasis",minutes:3,level:2,xp:30,desc:"La misma fras
